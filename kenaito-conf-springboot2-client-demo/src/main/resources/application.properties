# Server
server.port=8081

# Application
app.name=kenaito-conf-springboot2-client-demo
app.version=1.0.0

# Kenaito Config Center
kenaito.config.baseUrl=http://localhost:8080
kenaito.config.appName=demo
kenaito.config.profile=dev
kenaito.config.version=latest
kenaito.config.token=
kenaito.config.sync-interval-seconds=30

# Local configs (will be overridden by remote if exists)
db.url=jdbc:mysql://localhost:3306/local_db
db.username=local_user
custom.config1=local_value
