# Server
server.port=8081

# Application
app.name=kenaito-conf-springboot2-client-demo
app.version=1.0.0

# Kenaito Config Center
kenaito.config.baseUrl=${KENAITO_BASE_URL:http://localhost:8080}
kenaito.config.appName=${KENAITO_APP_NAME:kenaito-springboot-demo}
kenaito.config.profile=${KENAITO_ENV:daily}
kenaito.config.version=${KENAITO_VERSION:latest}
kenaito.config.token=${KENAITO_TOKEN:}
kenaito.config.sync-interval-seconds=${KENAITO_SYNC_INTERVAL:10}

# Local configs (will be overridden by remote if exists)
database.host=192.168.1.1
database.port=8888
database.name=xxxx
database.user=xxxx
database.password=xxxxxxxx
