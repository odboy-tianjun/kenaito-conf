# Server
server.port=8084

# Application
spring.application.name=kenaito-conf-springboot3-client-demo
app.name=kenaito-conf-springboot3-client-demo
app.version=1.0.0

# Kenaito Config Center
kenaito.config.base-url=${KENAITO_BASE_URL:http://localhost:8080}
kenaito.config.app-name=${KENAITO_APP_NAME:kenaito-springboot-demo}
kenaito.config.profile=${KENAITO_ENV:daily}
kenaito.config.version=${KENAITO_VERSION:latest}
kenaito.config.token=${KENAITO_TOKEN:}
kenaito.config.sync-interval-seconds=${KENAITO_SYNC_INTERVAL:10}
kenaito.config.sensitive-keys=password,secret,key,token

# Local configs (overridden by remote configs when they exist)
database.host=192.168.1.1
database.port=8888
database.name=xxxx
database.user=xxxx
database.password=xxxxxxxx
