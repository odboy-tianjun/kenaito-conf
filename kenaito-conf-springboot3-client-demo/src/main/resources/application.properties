# Server
server.port=8081

# Application
app.name=kenaito-conf-springboot3-client-demo
app.version=1.0.0

# Kenaito Config Center
kenaito.config.baseUrl=http://localhost:8080
kenaito.config.appName=kenaito-springboot-demo
kenaito.config.profile=daily
kenaito.config.version=latest
kenaito.config.token=
kenaito.config.sync-interval-seconds=30

# Local configs (will be overridden by remote if exists)
database.host=192.168.1.1
database.port=8888
database.name=xxxx
database.user=xxxx
database.password=xxxxxxxx
